name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate games
        run: node tools/check.mjs
      - name: Logic tests
        run: |
          for t in */test; do
            [ -d "$t" ] && node --test "$t"/*.test.js
          done
      - name: Build packages and catalog
        run: node tools/build-catalog.mjs --tag ci --out "$RUNNER_TEMP/dist"
      - uses: actions/checkout@v4
        with:
          repository: TetrisIQ/blackout-tool
          path: kit
      - name: Build the Pages site
        run: node tools/build-site.mjs --kit kit --out "$RUNNER_TEMP/site"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kit
      - run: cargo build --release --locked --manifest-path kit/Cargo.toml
      - name: Check the catalog with kit
        run: kit/target/release/kit catalog check "$RUNNER_TEMP/dist/catalog"
      # The repository folder itself is a local catalog (kit catalog add games <folder>).
      - name: Check the repository as a local catalog
        run: |
          # Only the tracked files: the kit checkout inside the workspace is not part of the catalog.
          mkdir "$RUNNER_TEMP/repo"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/repo"
          kit/target/release/kit catalog check "$RUNNER_TEMP/repo"
