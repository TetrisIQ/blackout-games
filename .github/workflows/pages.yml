name: Pages
# Publishes the game library (the kit's game hub, all games playable, installable as an offline app).
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      # The hub template comes from the kit repository (one hub for kit and Pages).
      - uses: actions/checkout@v4
        with:
          repository: TetrisIQ/blackout-tool
          path: kit
      - run: node tools/build-site.mjs --kit kit --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
