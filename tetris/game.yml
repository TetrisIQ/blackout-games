id: tetris
title: Tetris
description: Falling-blocks puzzle on a 10x20 board with a campaign (Standard, Lava and Night worlds with ten levels and a boss each, rated in stars) and a classic endless mode.
license: MIT
version: 0.1.0
entry: index.html
controls:
  - "Left/Right (A/D): move"
  - "Up (W/X): rotate"
  - "Down (S): soft drop"
  - "Space: hard drop"
  - "P: pause"
  - "R: restart"
  - "Esc: menu"
  - "?: how to play"
  - "Touch: tap rotate, drag move, drag down soft drop, flick down hard drop"
