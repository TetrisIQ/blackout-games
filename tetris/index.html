<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tetris</title>
  <script>!function(){var r=document.documentElement;if(r.getAttribute("data-theme"))return;var s=null;try{s=localStorage.getItem("kit-theme")}catch(e){}if(!s&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)s="dark";r.setAttribute("data-theme",s||"light");r.setAttribute("data-theme-auto","")}()</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tetris</h1>
    <p id="mode" class="hint"></p>
    <div class="layout">
      <canvas id="game" width="300" height="600"></canvas>
      <aside>
        <p>Next</p>
        <canvas id="next" width="120" height="120"></canvas>
        <div id="bossbox" hidden>
          <p id="boss-name"></p>
          <div class="hpbar"><i id="boss-hp"></i></div>
        </div>
        <p>Score<br><strong id="score">0</strong></p>
        <p>Lines<br><strong id="lines">0</strong></p>
        <p id="level-row">Level<br><strong id="level">1</strong></p>
        <p>Best<br><strong id="best">0</strong></p>
        <div class="bar touch-only">
          <button id="btn-pause" type="button">Pause</button>
          <button id="btn-restart" type="button">Restart</button>
        </div>
      </aside>
    </div>
    <p class="hint kbd-hint">←/→ move · ↑ rotate · ↓ soft drop · Space hard drop · P pause · R restart · Esc menu · ? how to play</p>
    <p><button id="btn-menu" type="button">Menu</button> <button id="btn-help" type="button">How to play</button></p>
  </main>
  <div id="screen" hidden role="dialog" aria-modal="true">
    <div class="card" id="screen-card"></div>
  </div>
  <div id="help" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="card">
      <h2 id="help-title"></h2>
      <div id="help-body"></div>
      <p id="help-dots" class="dots"></p>
      <p class="nav">
        <button id="help-back" type="button">Back</button>
        <button id="help-next" type="button">Next</button>
        <button id="help-close" type="button">Skip</button>
      </p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
