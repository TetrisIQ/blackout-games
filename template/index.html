<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Template</title>
  <script>!function(){var r=document.documentElement;if(r.getAttribute("data-theme"))return;var s=null;try{s=localStorage.getItem("kit-theme")}catch(e){}if(!s&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)s="dark";r.setAttribute("data-theme",s||"light");r.setAttribute("data-theme-auto","")}()</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Template</h1>
    <p>Score: <span id="score">0</span> · Best: <span id="best">0</span></p>
    <canvas id="game" width="320" height="320"></canvas>
    <div class="bar touch-only">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-restart" type="button">Restart</button>
    </div>
    <p class="hint kbd-hint">Arrows/WASD move · P pause · R restart</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
