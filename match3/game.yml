id: match3
title: Match 3
description: Swap neighbouring gems on an 8x8 board to line up three or more, build special gems and chain cascades. Four difficulties and ten worlds, each with a new element - rocks, cages, ice, conveyors, slime, portals, countdown bombs, fruit and fog.
license: MIT
version: 0.1.0
entry: index.html
controls:
  - "Mouse/touch: click two neighbouring gems or drag a gem"
  - "Arrow keys + Space/Enter: move cursor, select, then arrow to swap"
  - "H: hint"
  - "1/2/3: use hammer/bomb/rainbow powerup (earned in endless mode, kept per difficulty)"
  - "T: jump to the other end of a portal"
  - "L: level overview"
  - "Enter / tap the board: next level"
  - "P: pause"
  - "R: retry level"
