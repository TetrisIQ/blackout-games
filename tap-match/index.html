<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tap Match</title>
  <script>!function(){var r=document.documentElement;if(r.getAttribute("data-theme"))return;var s=null;try{s=localStorage.getItem("kit-theme")}catch(e){}if(!s&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)s="dark";r.setAttribute("data-theme",s||"light");r.setAttribute("data-theme-auto","")}()</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tap Match</h1>
    <section id="diff" hidden>
      <h2>Choose a difficulty</h2>
      <p class="hint">The difficulty sets how densely the boards are packed. Every difficulty has its own progress.</p>
      <div id="diff-list" class="diff-list"></div>
    </section>
    <section id="menu" hidden>
      <p class="hint">Difficulty: <b id="diff-name"></b> <button id="btn-diff" type="button">Change</button></p>
      <p class="hint">Powerups: <span id="stock"></span></p>
      <div class="worldbar">
        <button id="w-prev" type="button" aria-label="Previous world">&lsaquo;</button>
        <div>
          <h2 id="w-title"></h2>
          <p id="w-sub" class="hint"></p>
        </div>
        <button id="w-next" type="button" aria-label="Next world">&rsaquo;</button>
      </div>
      <div id="w-tiles" class="icons" aria-label="Tiles in this world"></div>
      <div id="grid" class="grid"></div>
    </section>
    <section id="play" hidden>
      <p>Level <span id="level">1</span> · Score: <span id="score">0</span> · Best: <span id="best">0</span></p>
      <div id="toast" class="toast"><span id="toast-text"></span><span id="series" class="series"></span></div>
      <canvas id="game" width="414" height="566"></canvas>
      <div class="bar">
        <button id="btn-undo" type="button">Undo</button>
        <button id="btn-hint" type="button">Hint</button>
        <button id="btn-shuffle" type="button">Shuffle</button>
        <button id="btn-slot" type="button">+1</button>
      </div>
      <div class="bar">
        <button id="btn-levels" type="button">Levels</button>
        <span class="touch-only">
          <button id="btn-pause" type="button">Pause</button>
          <button id="btn-restart" type="button">Restart</button>
        </span>
      </div>
      <p class="hint kbd-hint">Click a free tile · U undo · H hint · S shuffle · + extra slot · P pause · R restart · L levels · ? how to play</p>
    </section>
    <p><button id="btn-help" type="button">How to play</button></p>
  </main>
  <div id="help" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="card">
      <h2 id="help-title"></h2>
      <div id="help-body"></div>
      <p id="help-dots" class="dots"></p>
      <p class="nav">
        <button id="help-back" type="button">Back</button>
        <button id="help-next" type="button">Next</button>
        <button id="help-close" type="button">Skip</button>
      </p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
