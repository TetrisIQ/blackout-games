id: tap-match
title: Tap Match
description: Tap free tiles from a stacked board into a 7-slot tray; three equal tiles vanish. Clear the board before the tray overflows. 300 levels in 6 worlds with new tiles as you go.
license: MIT
version: 0.4.0
entry: index.html
controls:
  - "Mouse / touch: tap a free tile"
  - "U: undo"
  - "H: hint"
  - "S: shuffle"
  - "P: pause"
  - "R: restart level"
  - "L / Esc: level overview"
  - "?: how to play"
